    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0a0b10; color: #e0e0e0; }
        .top-bar { background: #1a1c23; padding: 10px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 1.4rem; font-weight: bold; color: #c9a84c; }
        .update-info { font-size: 0.8rem; color: #aaa; }
        .live-dot { color: #4ade80; animation: pulse 1s infinite; }
        .breaking-news { background: linear-gradient(90deg, #c9a84c, #e0b840); color: #000; padding: 8px 20px; margin: 10px 15px; border-radius: 6px; font-weight: bold; display: none; }
        .search-box { margin: 10px 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #444; background: #1a1c23; color: #fff; min-width: 200px; }
        .search-box button { background: #c9a84c; border: none; border-radius: 20px; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .update-message { text-align: center; color: #4ade80; font-size: 0.8rem; margin: 0 15px 10px; display: none; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 20px; }
        .news-card { background: #1e1f27; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a35; transition: transform 0.2s; cursor: pointer; }
        .news-card:hover { transform: translateY(-4px); border-color: #c9a84c; }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #222; }
        .card-body { padding: 15px; }
        .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .card-desc { font-size: 0.8rem; color: #aaa; margin-bottom: 12px; }
        .card-footer { display: flex; justify-content: space-between; font-size: 0.7rem; color: #777; }
        .source-badge { background: #c9a84c; color: #000; padding: 3px 10px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }
        .loading { text-align: center; padding: 40px; color: #c9a84c; display: none; }
        footer { text-align: center; padding: 20px; color: #666; font-size: 0.8rem; border-top: 1px solid #222; margin-top: 20px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body oncontextmenu="return false;">

            { url: "https://www.nationalpost.com/rss", lang: "en", country: "ca" },
            { url: "https://www.thestar.com/rss", lang: "en", country: "ca" },
            { url: "https://www.abc.net.au/rss", lang: "en", country: "au" },
            { url: "https://www.smh.com.au/rss", lang: "en", country: "au" },
            { url: "https://www.nzherald.co.nz/rss", lang: "en", country: "nz" },

            // --- أفريقيا ---
            { url: "https://www.africanews.com/rss", lang: "en", country: "af" },
            { url: "https://www.nation.africa/rss", lang: "en", country: "ke" },
            { url: "https://www.punchng.com/feed", lang: "en", country: "ng" },
            { url: "https://www.standardmedia.co.ke/rss", lang: "en", country: "ke" },
            { url: "https://www.iol.co.za/rss", lang: "en", country: "za" },
            { url: "https://www.news24.com/rss", lang: "en", country: "za" },
            { url: "https://www.herald.co.zw/rss", lang: "en", country: "zw" },
            { url: "https://www.monitor.co.ug/rss", lang: "en", country: "ug" },
            { url: "https://www.theeastafrican.co.ke/rss", lang: "en", country: "ke" },
            { url: "https://www.busiweek.com/rss", lang: "en", country: "ug" },

            // --- إيران وتركيا (بدون إسرائيل) ---
            { url: "https://www.irna.ir/rss", lang: "ar", country: "ir" },
            { url: "https://www.presstv.com/rss", lang: "en", country: "ir" },
            { url: "https://www.dailysabah.com/rss", lang: "en", country: "tr" },
            { url: "https://www.hurriyetdailynews.com/rss", lang: "en", country: "tr" },
        ];

        const CORS_PROXY = 'https://corsproxy.io/?url=';
        let allNews = [];
        let displayedLinks = new Set();
        let searchQuery = '';

        // ================== ترجمة مجانية ==================
        async function translateToArabic(text, lang = 'auto') {
            if (!text || !text.trim() || lang === 'ar') return text;
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${lang}&tl=ar&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                let r = '';
                if (data && data[0]) data[0].forEach(p => { if (p[0]) r += p[0]; });
                return r || text;
            } catch (e) { return text; }
        }

        // ================== تحليل RSS ==================
        function parseRSS(xmlText) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, "text/xml");
            const items = xml.querySelectorAll("item");
            return Array.from(items).map(item => ({
                title: item.querySelector("title")?.textContent?.trim() || "",
                link: item.querySelector("link")?.textContent?.trim() || "",
                description: item.querySelector("description")?.textContent?.trim() || "",
                pubDate: item.querySelector("pubDate")?.textContent?.trim() || new Date().toISOString(),
                image: item.querySelector("enclosure")?.getAttribute("url") || null
            }));
        }

        // ================== جلب مصدر واحد ==================
        async function fetchSingleSource(source) {
            try {
                const url = CORS_PROXY + encodeURIComponent(source.url);
                const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
                if (!res.ok) return [];
                const xml = await res.text();
                let items = parseRSS(xml);
                if (source.lang !== 'ar') {
                    items = await Promise.all(items.map(async (item) => {
                        item.title = await translateToArabic(item.title, source.lang);
                        if (item.description) item.description = await translateToArabic(item.description, source.lang);
                        return item;
                    }));
                }
                return items;
            } catch (e) { return []; }
        }

        // ================== جلب كل المصادر ==================
        async function fetchAllSources(showLoader = true) {
            if (showLoader) document.getElementById('loadingSpinner').style.display = 'block';
            const chunkSize = 10;
            let fresh = [];
            for (let i = 0; i < NEWS_SOURCES.length; i += chunkSize) {
                const chunk = NEWS_SOURCES.slice(i, i + chunkSize);
                const results = await Promise.all(chunk.map(s => fetchSingleSource(s)));
                fresh.push(...results.flat());
            }

            const newItems = fresh.filter(item => !displayedLinks.has(item.link));
            const msg = document.getElementById('updateMessage');
            if (newItems.length > 0) {
                newItems.forEach(item => displayedLinks.add(item.link));
                allNews = [...newItems, ...allNews].sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                appendCards(newItems);
                msg.textContent = `✓ تمت إضافة ${newItems.length} أخبار جديدة`;
                msg.style.color = '#4ade80';
            } else {
                msg.textContent = '⏳ لم يتم العثور على أخبار جديدة';
                msg.style.color = '#aaa';
            }
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 4000);

            if (allNews.length > 0) {
                document.getElementById('breakingNews').style.display = 'flex';
                document.getElementById('breakingText').textContent = allNews[0].title;
            }
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ar-IQ');
            if (showLoader) document.getElementById('loadingSpinner').style.display = 'none';
        }

        // ================== عرض البطاقات ==================
        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                ${item.image ? `<img src="${item.image}" class="card-img" onerror="this.style.display='none'">` : ''}
                <div class="card-body">
                    <span class="source-badge">مرجع العراق</span>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">${(item.description || '').replace(/<[^>]*>/g, '').substring(0, 100)}...</p>
                    <div class="card-footer">
                        <span><i class="far fa-clock"></i> ${new Date(item.pubDate).toLocaleDateString('ar-IQ')}</span>
                    </div>
                </div>
            `;
            return card;
        }

        function appendCards(newItems) {
            const container = document.getElementById('newsContainer');
            if (searchQuery) { rebuildGrid(); return; }
            newItems.slice().reverse().forEach(item => container.prepend(createCard(item)));
            while (container.children.length > 50) container.lastChild.remove();
        }

        function rebuildGrid() {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';
            let filtered = allNews.filter(n => !searchQuery || n.title.includes(searchQuery));
            filtered.slice(0, 50).forEach(item => container.appendChild(createCard(item)));
        }

        function searchNews() {
            searchQuery = document.getElementById('searchInput').value.trim();
            rebuildGrid();
        }

        // ================== زر التحديث الفوري (محسّن) ==================
        async function forceUpdate() {
            const btn = document.getElementById('forceUpdateBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...';
            await fetchAllSources(true);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث الأخبار';
        }

        // ================== ترند Google ==================
        async function fetchTrends() {
            try {
                const url = CORS_PROXY + 'https://trends.google.com/trending/rss?geo=IQ';
                const res = await fetch(url);
                const xml = await res.text();
                let items = parseRSS(xml);
                items = await Promise.all(items.map(async (item) => {
                    item.title = '🔥 ' + await translateToArabic(item.title, 'en');
                    return item;
                }));
                const newItems = items.filter(item => !displayedLinks.has(item.link));
                if (newItems.length > 0) {
                    newItems.forEach(item => displayedLinks.add(item.link));
                    allNews = [...newItems, ...allNews];
                    appendCards(newItems);
                }
            } catch (e) { alert('تعذر جلب الترندات'); }
        }

        function startAutoUpdate() {
            setInterval(async () => { await fetchAllSources(false); }, 30000);
        }

        window.onload = async () => {
            await fetchAllSources(true);
            rebuildGrid();
            startAutoUpdate();
        };
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('keydown', e => { if (e.ctrlKey && (e.key === 'u' || e.key === 's')) e.preventDefault(); });
    </script>
</body>
